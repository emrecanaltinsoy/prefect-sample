dependencies = [
    "boto3>=1.43.122",
    "fastapi>=0.115",
    "prefect-log-handler",
    "uvicorn>=0.30",
]

[tool.uv.sources]
prefect-log-handler = { path = "../../packages/prefect-log-handler" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
