[project]
name = "orchestrator-api"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115",
    "prefect==3.9.0",   # keep in line with the server image and the root project
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
