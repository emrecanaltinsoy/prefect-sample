[project]
name = "prefect-test"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.27",
    "prefect>=3.0,<4",
    "prefect-docker>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
